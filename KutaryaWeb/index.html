<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>Kutarya — Projeler & Deneyimler</title>
    <meta
      name="description"
      content="Kutarya: oyunlar, masaüstü ve mobil uygulamalar, web projeleri ve kaynak kod."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/logo-mark.svg" />
    <script>
      try {
        var t = localStorage.getItem("kutarya-theme") || "light";
        if (t === "system")
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        if (["light", "warm", "dark"].includes(t)) {
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme =
            t === "dark" ? "dark" : "light";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
