<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#f7f9fc" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo-mark.svg" />
    <title>Sayfa Bulunamadı | Kutarya</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #122033; background: #f7f9fc; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(680px, 100%); border-top: 4px solid #078a68; padding: 40px 0; }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; font-weight: 800; }
      .brand img { width: 34px; height: 34px; }
      .code { margin: 56px 0 8px; color: #078a68; font-size: 0.82rem; font-weight: 800; }
      h1 { margin: 0; max-width: 560px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.25rem, 8vw, 4.6rem); line-height: 1.04; }
      p { max-width: 560px; margin: 20px 0 28px; color: #526174; font-size: 1.05rem; line-height: 1.7; }
      nav { display: flex; flex-wrap: wrap; gap: 10px; }
      a.action { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #cbd5e1; color: #122033; background: #fff; text-decoration: none; font-weight: 700; }
      a.action:first-child { border-color: #078a68; color: #fff; background: #078a68; }
      a:focus-visible { outline: 3px solid #f1b24b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"><img src="/brand/logo-mark.svg" alt="" />Kutarya Teknik Kaynak</a>
      <div class="code">HTTP 404</div>
      <h1>Bu sayfa artık burada değil.</h1>
      <p>Adres değişmiş veya içerik kaldırılmış olabilir. Teknik makalelere, hata kayıtlarına ve sistem rehberlerine aşağıdaki bağlantılardan ulaşabilirsiniz.</p>
      <nav aria-label="Devam bağlantıları">
        <a class="action" href="/">Ana sayfaya dön</a>
        <a class="action" href="/makaleler">Makaleleri aç</a>
        <a class="action" href="/hatalar">Hata kayıtlarını incele</a>
      </nav>
    </main>
  </body>
</html>
